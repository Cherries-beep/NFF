""" Файл оркестрации "

version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: notes_fastapi_app
    restart: always
    command: uvicorn notes_fastapi.main:app --host 0.0.0.0 --port 8000 --reload # команда, которую Docker выполнит при
    # запуске контейнера. Запуск fastapi сервера
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db  # контейнер app будет запускаться после контейнера db.
volumes:
  postgres_data: